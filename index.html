<title>Калькулятор потолка</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: конфигуратор как у Apple — слева закреплён технический план комнаты на сетке, справа шаги выбора, внизу закреплены итог и кнопка */
:root{
  /* Одна палитра на всю страницу: тёплая ночь и золотой свет светильников */
  --bg:#12110E; --surface:#1A1915; --surface-2:#211F1A; --fg:#F2EFE6; --muted:#A39D8E; --line:rgba(242,239,230,.09); --line-strong:rgba(242,239,230,.18);
  --accent:#D9C690; --accent-2:#B8A06A; --accent-soft:rgba(217,198,144,.10); --grid:rgba(242,239,230,.045); --ok:#9CC28F;
  --display:"Inter Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,Menlo,monospace;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 120px}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:600 15px/1 var(--display);flex:none}
.brand b{display:block;font:600 16px/1.2 var(--display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:13px}
@media (max-width:440px){.phone{font-size:12px!important}.brand small{font-size:12px}}
.phone{font:500 14px/1 var(--mono);color:var(--muted);white-space:nowrap;user-select:all}

/* заголовок страницы */
.hero{padding-block:44px 28px;display:grid;gap:10px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(32px,5vw,56px)/1.04 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance;max-width:16ch}
.lead{color:var(--muted);max-width:56ch;margin:0;font-size:17px}

/* две колонки */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr);gap:24px}}

/* план комнаты */
.plan{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);border:1px solid var(--line);border-radius:var(--r);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/20px 20px,var(--surface);overflow:hidden}
@media (max-width:900px){.plan{position:relative;top:0}}
.plan-head{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;font:500 12px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.plan svg{display:block;width:100%;height:auto;max-width:100%}
.plan-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface)}
.plan-foot div{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.plan-foot div:last-child{border-right:0}
.plan-foot span{display:block;font:500 11px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan-foot b{font:600 18px/1.4 var(--display);letter-spacing:-.01em}

/* комнаты */
.rooms{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .x{opacity:.6;font-size:13px}

/* шаги */
.step{padding-block:28px;border-top:1px solid var(--line);display:grid;gap:16px}
.step:first-of-type{border-top:0;padding-top:0}
.step h2{margin:0;font:600 22px/1.25 var(--display);letter-spacing:-.02em;text-wrap:balance}
.step h2 span{color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:-8px 0 0}

.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 14px;display:grid;gap:2px}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field label{font-size:12px;color:var(--muted)}
.field .in{display:flex;align-items:baseline;gap:6px}
.field input{border:0;outline:0;background:transparent;width:100%;min-width:0;font:600 22px/1.3 var(--display);letter-spacing:-.01em;padding:0}
.field em{font:500 13px var(--mono);color:var(--muted);font-style:normal}
input[type=range]{width:100%;accent-color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:14px 16px;text-align:left;cursor:pointer;display:grid;gap:4px;min-height:96px;position:relative}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{border:2px solid var(--accent);padding:13px 15px}
.tile b{font:600 16px/1.3 var(--display)}
.tile small{color:var(--muted);font-size:13px;line-height:1.35}
.tile .p{font:500 13px var(--mono);color:var(--fg);margin-top:auto}
.swatch{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);position:absolute;right:14px;top:14px}

.rows{display:grid;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:15px}
.row .t small{color:var(--muted);font:500 12px var(--mono)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;flex:none}
.stepper button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:34px;text-align:center;font:600 15px var(--display)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1;width:100%;height:100%}
.switch i{position:absolute;inset:0;pointer-events:none;border-radius:999px;background:var(--line-strong);transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.form{display:grid;gap:12px}
.form .field input{font:500 17px/1.4 var(--body)}
input::placeholder{color:var(--muted);opacity:.55}
.note{font-size:13px;color:var(--muted);margin:0}

/* закреплённая панель итога */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.total small{display:block;color:var(--muted);font-size:12px}
.total b{font:600 26px/1.15 var(--display);letter-spacing:-.02em}
.cta{border:0;border-radius:999px;background:var(--accent);color:var(--bg);font:600 16px/1 var(--body);padding:15px 22px;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* окно отправки */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(20,20,16,.45);display:grid;place-items:end center;padding:16px}
.sheet .card{width:min(560px,100%);background:var(--surface);border-radius:20px;padding:22px;display:grid;gap:14px;max-height:calc(100% - 32px);overflow:auto;border:1px solid var(--line)}
.sheet h3{margin:0;font:600 22px/1.25 var(--display);letter-spacing:-.02em}
.sheet pre{margin:0;white-space:pre-wrap;font:13px/1.55 var(--mono);background:var(--accent-soft);border-radius:12px;padding:14px;color:var(--fg);overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.ghostbtn{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:13px 18px;cursor:pointer;font-weight:500}
a.cta{text-decoration:none;display:inline-flex;align-items:center}

/* панель владельца */
.owner{display:grid;gap:20px;padding-block:32px}
.owner .rows .row input{width:110px;text-align:right;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--bg);font:500 15px var(--mono)}
.owner .row input.wide{width:200px}
.toast{color:var(--ok);font-size:14px;min-height:1.4em}
.foot{color:var(--muted);font-size:13px;padding-block:32px;border-top:1px solid var(--line);margin-top:40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Заставка: комната в темноте, по очереди загораются светильники ===== */
html,body{overflow-x:clip}
.intro{position:relative;width:100vw;margin-left:calc(50% - 50vw);overflow:hidden;padding-bottom:40px}
.room{position:relative;width:min(100%,calc(58vh*1536/930),1400px);margin:0 auto;aspect-ratio:1536/930;overflow:hidden}
.room img{position:absolute;inset:0;width:100%;height:100%;display:block;transform:scale(calc(1 + var(--p,0)*.08));transform-origin:50% 30%}
.room .night{position:absolute;inset:0;background:rgba(12,11,9,.86)}
.spot{position:absolute;width:13%;aspect-ratio:3/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,214,1),rgba(255,226,160,.55) 35%,rgba(255,220,150,0));mix-blend-mode:screen;opacity:.75;pointer-events:none}
.spot::after{content:"";position:absolute;left:50%;top:50%;width:300%;height:900%;transform:translate(-50%,-4%);background:radial-gradient(50% 50% at 50% 0%,rgba(255,226,170,.2),rgba(255,226,170,0))}
.room .vign{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(18,17,14,0) 34%),radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(18,17,14,.75))}
.room .night{opacity:0}
.intro-copy{position:relative;max-width:1180px;margin:-150px auto 0;padding:0 16px;display:grid;gap:16px;transform:translateY(calc(var(--p,0)*30px))}
@media (max-width:760px){.intro-copy{margin-top:-28px}.spot::after{display:none}}
.intro h1{font:600 clamp(40px,6.2vw,80px)/.98 var(--display);letter-spacing:-.045em;max-width:none}
.intro h1 em{font:italic 500 1.12em/1 var(--serif);letter-spacing:-.01em;color:var(--accent)}
.ln{display:block;overflow:hidden;padding-bottom:.07em}
.ln>span{display:block}
.intro-lead{margin:0;color:var(--muted);font-size:18px;max-width:42ch}
.intro-cta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rating{display:inline-flex;gap:8px;align-items:center;font:500 13px/1.3 var(--mono);color:var(--muted)}
.rating b{color:var(--fg);font:600 15px var(--display)}
.intro-meta{font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.03em}
.intro-meta b{color:var(--accent);font-weight:500}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-block:28px 8px;overflow:hidden;padding:0}
@media (max-width:760px){.how{grid-template-columns:minmax(0,1fr)}}
.how li{list-style:none;padding:20px 22px;border-right:1px solid var(--line);display:grid;gap:6px;min-width:0}
.how li:last-child{border-right:0}
@media (max-width:760px){.how li{border-right:0;border-bottom:1px solid var(--line)}.how li:last-child{border-bottom:0}}
.how .n{font:500 12px var(--mono);color:var(--accent);letter-spacing:.08em}
.how b{font:600 18px/1.25 var(--display);letter-spacing:-.01em}
.how p{margin:0;color:var(--muted);font-size:14px}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:8px 36px}
@media (max-width:760px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trust div{padding:14px 2px;border-top:1px solid var(--line-strong)}
.trust b{display:block;font:600 30px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.trust span{color:var(--muted);font-size:13px}
/* анимации включаются только когда скрипт добавил класс .anim */
.anim .ln>span{transform:translateY(105%);animation:lnUp 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(2.6s + var(--i,0)*.12s)}
.anim .intro-lead,.anim .intro-cta,.anim .intro .eyebrow,.anim .intro-meta{opacity:0;animation:fadeUp .8s ease forwards;animation-delay:calc(2.6s + var(--d,.5s))}
.anim .room .night{opacity:1;animation:lightsOn 2.2s ease forwards;animation-delay:1.6s}
.anim .spot{opacity:0;animation:flick .7s ease forwards;animation-delay:calc(.35s + var(--k)*.2s)}
.anim .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k,0)*.1s)}
.anim .reveal.in{opacity:1;transform:none}
@keyframes lnUp{to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lightsOn{to{opacity:0}}
@keyframes flick{0%{opacity:0}25%{opacity:1}40%{opacity:.25}60%{opacity:1}100%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.anim .room .night{opacity:0}.anim .ln>span,.anim .reveal,.anim .intro-lead,.anim .intro-cta,.anim .intro .eyebrow,.anim .intro-meta{opacity:1;transform:none}.room img,.intro-copy{transform:none!important}}
</style>
</head>

/* ===== Состояние ===== */
const parse = () => { const h = decodeURIComponent(location.hash.slice(1)); const [slug, mode] = h.split("."); return {slug: FIRMS[slug] ? slug : "demo", mode: mode || ""}; };
let route = parse();
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function firm(){ const f = FIRMS[route.slug]; const saved = store.get("potolok:"+route.slug) || {}; return {...f, ...saved, prices:{...f.prices, ...(saved.prices||{})}}; }

const newRoom = (n) => ({name:"Комната "+n, a:4, b:4, tex:"matte", spot:6, chand:0, corners:4, pipes:0, shadow:false, line:0});
let state = {rooms:[newRoom(1)], cur:0, name:"", tel:"", addr:"", when:""};

const rub = n => Math.round(n).toLocaleString("ru-RU").replace(/,/g," ") + " ₽";
const m = n => (Math.round(n*100)/100).toLocaleString("ru-RU");
function calcRoom(r, p){
  const area = r.a * r.b, per = 2*(r.a + r.b);
  const parts = [
    ["Полотно", area * p[r.tex]],
    ["Светильники", r.spot * p.spot],
    ["Люстры", r.chand * p.chand],
    ["Углы сверх 4", Math.max(0, r.corners - 4) * p.corner],
    ["Обход труб", r.pipes * p.pipe],
    ["Теневой профиль", r.shadow ? per * p.shadow : 0],
    ["Световые линии", r.line * p.line]
  ];
  return {area, per, parts, sum: parts.reduce((s, x) => s + x[1], 0)};
}
function calcAll(){ const p = firm().prices; const rooms = state.rooms.map(r => calcRoom(r, p)); const sum = rooms.reduce((s, r) => s + r.sum, 0); return {rooms, sum, total: Math.max(sum, p.minOrder), min: sum < p.minOrder}; }

/* ===== План комнаты (SVG) ===== */
function planSVG(r){
  const W = 640, H = 460, pad = 70;
  const s = Math.min((W - 2*pad) / r.a, (H - 2*pad) / r.b);
  const w = r.a * s, h = r.b * s, x = (W - w)/2, y = (H - h)/2;
  const ink = "var(--fg)", mut = "var(--muted)", acc = "var(--accent)";
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="План комнаты ${m(r.a)} на ${m(r.b)} метра">`;
  const tex = {matte:"var(--surface)", satin:"var(--accent-soft)", gloss:"var(--surface)", fabric:"var(--accent-soft)"}[r.tex];
  g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${tex}" stroke="${ink}" stroke-width="2"/>`;
  if (r.tex === "gloss") g += `<path d="M${x+w*0.08} ${y+h*0.92} L${x+w*0.45} ${y+h*0.08}" stroke="var(--line-strong)" stroke-width="18" opacity=".35" fill="none"/>`;
  if (r.shadow) g += `<rect x="${x+7}" y="${y+7}" width="${w-14}" height="${h-14}" fill="none" stroke="${acc}" stroke-width="1" stroke-dasharray="5 4"/>`;
  if (r.line > 0) { const L = Math.min(r.line, r.a) * s; g += `<line x1="${x + (w-L)/2}" y1="${y+h/2}" x2="${x + (w+L)/2}" y2="${y+h/2}" stroke="${acc}" stroke-width="4" stroke-linecap="round"/>`; }
  if (r.chand > 0) for (let i = 0; i < r.chand; i++) { const cx = x + w*(.3 + .4*(i+1)/(r.chand+1)), cy = y + h/2; g += `<circle cx="${cx}" cy="${cy}" r="11" fill="var(--surface)" stroke="${ink}" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="4" fill="${ink}"/>`; }
  if (r.spot > 0 && r.chand > 0) {
    // светильники по кругу вокруг люстры: по контуру на отступе 20% от стен
    const ix = x + w*.16, iy = y + h*.18, iw = w*.68, ih = h*.64, P = 2*(iw + ih);
    for (let k = 0; k < r.spot; k++) {
      let d = (k + .5) * P / r.spot, cx, cy;
      if (d < iw) { cx = ix + d; cy = iy; } else if ((d -= iw) < ih) { cx = ix + iw; cy = iy + d; }
      else if ((d -= ih) < iw) { cx = ix + iw - d; cy = iy + ih; } else { d -= iw; cx = ix; cy = iy + ih - d; }
      g += `<circle cx="${cx}" cy="${cy}" r="5" fill="${acc}"/><circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="${acc}" stroke-opacity=".35"/>`;
    }
  } else if (r.spot > 0) {
    const cols = Math.max(1, Math.round(Math.sqrt(r.spot * r.a / r.b))), rows = Math.ceil(r.spot / cols); let k = 0;
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols && k < r.spot; j++, k++) {
      const inRow = Math.min(cols, r.spot - i*cols);
      const cx = x + w*(j+1)/(inRow+1), cy = y + h*(i+1)/(rows+1);
      g += `<circle cx="${cx}" cy="${cy}" r="5" fill="${acc}"/><circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="${acc}" stroke-opacity=".35"/>`;
    }
  }
  for (let i = 0; i < r.pipes; i++) { const px = x + 16 + i*18, py = y + h - 16; g += `<circle cx="${px}" cy="${py}" r="6" fill="none" stroke="${ink}" stroke-width="1.5"/>`; }
  // размерные линии
  const t = 8;
  g += `<g stroke="${mut}" stroke-width="1" fill="none"><line x1="${x}" y1="${y-28}" x2="${x+w}" y2="${y-28}"/><line x1="${x}" y1="${y-28-t}" x2="${x}" y2="${y-28+t}"/><line x1="${x+w}" y1="${y-28-t}" x2="${x+w}" y2="${y-28+t}"/>`;
  g += `<line x1="${x-28}" y1="${y}" x2="${x-28}" y2="${y+h}"/><line x1="${x-28-t}" y1="${y}" x2="${x-28+t}" y2="${y}"/><line x1="${x-28-t}" y1="${y+h}" x2="${x-28+t}" y2="${y+h}"/></g>`;
  g += `<g font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" fill="${mut}"><text x="${x+w/2}" y="${y-40}" text-anchor="middle">${m(r.a)} м</text>`;
  g += `<text x="${x-42}" y="${y+h/2}" text-anchor="middle" transform="rotate(-90 ${x-42} ${y+h/2})">${m(r.b)} м</text></g>`;
  g += `<text x="${x+w/2}" y="${y+h+40}" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="${ink}">S = ${m(r.a*r.b)} м²</text>`;
  return g + `</svg>`;
}

let introBound = false, rendered = 0;
function initIntro(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const els = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); countUp(e.target); } }), {threshold:.2});
    els.forEach(el => io.observe(el));
  } else els.forEach(el => el.classList.add("in"));
  if (!introBound) { introBound = true;
    let ticking = false;
    addEventListener("scroll", () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false;
      const it = document.getElementById("intro"); if (!it || reduce) return;
      const p = Math.min(1, Math.max(0, scrollY / Math.max(1, it.offsetHeight))); it.style.setProperty("--p", p.toFixed(3)); }); }, {passive:true});
  }
}

  const to = parseFloat(b.dataset.count), dec = b.dataset.dec ? 1 : 0, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0)/1100), v = to * (1 - Math.pow(1 - k, 3));
    b.textContent = dec ? v.toFixed(1).replace(".", ",") : Math.round(v).toLocaleString("ru-RU"); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("anim");
/* ===== Разметка ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stepper(key, val, min, max, step){ return `<div class="stepper"><button type="button" data-dec="${key}" ${val<=min?"disabled":""} aria-label="Меньше">−</button><output class="num" id="o-${key}">${m(val)}</output><button type="button" data-inc="${key}" ${val>=max?"disabled":""} aria-label="Больше">+</button></div>`; }

function renderClient(){
  const f = firm(), p = f.prices, r = state.rooms[state.cur], c = calcRoom(r, p);
  document.title = f.name + " — расчёт потолка";
  document.getElementById("bar").hidden = false;
  document.getElementById("app").innerHTML = `
  <header class="top">
    <div class="brand"><div class="mark">${esc(f.short)}</div><div><b>${esc(f.name)}</b><small>Натяжные потолки · ${esc(f.city)}</small></div></div>
    <span class="phone">${esc(f.phone)}</span>
  </header>
  <section class="intro" id="intro">
    <div class="room"><img src="${HERO_IMG}" alt="Гостиная с натяжным потолком и точечными светильниками"><div class="night"></div><i class="spot" style="left:18.2%;top:10.6%;--k:0"></i><i class="spot" style="left:23.4%;top:23%;--k:1"></i><i class="spot" style="left:63.5%;top:23.1%;--k:2"></i><i class="spot" style="left:67.9%;top:11%;--k:3"></i><i class="spot" style="left:80.1%;top:23.2%;--k:4"></i><i class="spot" style="left:88.3%;top:11%;--k:5"></i><div class="vign"></div></div>
    <div class="intro-copy">
      <span class="eyebrow" style="--d:0s">Натяжные потолки · ${esc(f.city)}</span>
      <h1><span class="ln"><span style="--i:0">Свет, который</span></span><span class="ln"><span style="--i:1"><em>видно</em> сразу.</span></span></h1>
      <p class="intro-lead" style="--d:.45s">Укажите размеры комнаты, выберите полотно и светильники — посчитаем по прайсу «${esc(f.name)}» за 10 секунд. Замер бесплатный.</p>
      <div class="intro-cta" style="--d:.6s"><button type="button" class="cta" data-go="calc">Рассчитать потолок</button>${f.n ? `<span class="rating"><b>★ ${String(f.r.toFixed(1)).replace(".", ",")}</b>${f.n} ${ocenok(f.n)} на Яндекс Картах</span>` : ""}</div>
      <span class="intro-meta" style="--d:.75s">Комната 4 × 4 м · матовое · 6 светильников — от <b>${rub(calcRoom(newRoom(1), p).sum)}</b></span>
    </div>
  </section>
  <ol class="how">
    <li class="reveal" style="--k:0"><span class="n">01</span><b>Размеры</b><p>Введите длину и ширину комнаты — план нарисуется сам.</p></li>
    <li class="reveal" style="--k:1"><span class="n">02</span><b>Полотно и свет</b><p>Выберите фактуру, светильники и профиль. Цена меняется сразу.</p></li>
    <li class="reveal" style="--k:2"><span class="n">03</span><b>Бесплатный замер</b><p>Оставьте заявку — мастер приедет и назовёт точную цену.</p></li>
  </ol>
  <div class="trust">
    ${f.n ? `<div class="reveal" style="--k:0"><b data-count="${f.r}" data-dec="1">${String(f.r.toFixed(1)).replace(".", ",")}</b><span>рейтинг на Яндекс Картах</span></div><div class="reveal" style="--k:1"><b data-count="${f.n}">${f.n}</b><span>${ocenok(f.n)} клиентов</span></div>` : ""}
    <div class="reveal" style="--k:2"><b>10 сек</b><span>на расчёт цены</span></div>
    <div class="reveal" style="--k:3"><b>0 ₽</b><span>за выезд на замер</span></div>
  </div>
  <div class="grid" id="calc" style="scroll-margin-top:16px">
    <figure class="plan" style="margin:0">
      <div class="plan-head"><span>План · ${esc(r.name)}</span><span class="num">М 1:${scaleOf(r)}</span></div>
      <div id="svg">${planSVG(r)}</div>
      <div class="plan-foot">
        <div><span>Площадь</span><b class="num" id="pf-a">${m(c.area)} м²</b></div>
        <div><span>Периметр</span><b class="num" id="pf-p">${m(c.per)} м</b></div>

    <div>
      <div class="rooms" role="group" aria-label="Комнаты">
        ${state.rooms.map((x,i)=>`<button type="button" class="chip" data-room="${i}" aria-pressed="${i===state.cur}">${esc(x.name)}${state.rooms.length>1?`<span class="x" data-del="${i}" aria-label="Удалить">✕</span>`:""}</button>`).join("")}
        ${state.rooms.length<6?`<button type="button" class="chip add" id="addRoom">+ Ещё комната</button>`:""}
      </div>
      <section class="step">
        <h2>Размеры. <span>Какая комната?</span></h2>
        <div class="dims">
          <div class="field"><label for="in-a">Длина</label><div class="in"><input id="in-a" inputmode="decimal" value="${m(r.a)}"><em>м</em></div></div>
          <div class="field"><label for="in-b">Ширина</label><div class="in"><input id="in-b" inputmode="decimal" value="${m(r.b)}"><em>м</em></div></div>
        </div>
        <input type="range" id="rng" min="4" max="60" step="0.5" value="${Math.min(60,Math.max(4,r.a*r.b))}" aria-label="Площадь">

      <section class="step">
        <h2>Полотно. <span>Какое выбрать?</span></h2>
        <div class="tiles">${TEXTURES.map(t=>`<button type="button" class="tile" data-tex="${t.id}" aria-pressed="${r.tex===t.id}"><i class="swatch" style="background:${t.sw}"></i><b>${t.name}</b><small>${t.desc}</small><span class="p num">${rub(p[t.id])} / м²</span></button>`).join("")}</div>
      </section>
      <section class="step">
        <h2>Свет. <span>Что ставим?</span></h2>
        <div class="rows">
          <div class="row"><div class="t"><b>Точечные светильники</b><small>${rub(p.spot)} / шт</small></div>${stepper("spot",r.spot,0,40,1)}</div>
          <div class="row"><div class="t"><b>Люстра</b><small>${rub(p.chand)} / шт</small></div>${stepper("chand",r.chand,0,4,1)}</div>
          <div class="row"><div class="t"><b>Световая линия</b><small>${rub(p.line)} / м</small></div>${stepper("line",r.line,0,20,0.5)}</div>
        </div>
      </section>
      <section class="step">
        <h2>Детали. <span>Что ещё в комнате?</span></h2>
        <div class="rows">
          <div class="row"><div class="t"><b>Углы</b><small>4 входят в цену, далее ${rub(p.corner)} / шт</small></div>${stepper("corners",r.corners,4,16,1)}</div>
          <div class="row"><div class="t"><b>Трубы через потолок</b><small>${rub(p.pipe)} / шт</small></div>${stepper("pipes",r.pipes,0,6,1)}</div>
          <div class="row"><div class="t"><b>Теневой профиль</b><small>${rub(p.shadow)} / м · по периметру ${m(c.per)} м</small></div><label class="switch"><input type="checkbox" id="sh" ${r.shadow?"checked":""} aria-label="Теневой профиль"><i></i></label></div>
        </div>
      </section>
      <section class="step">
        <h2>Замер. <span>Куда приехать?</span></h2>
        <div class="form">
          <div class="field"><label for="f-name">Имя</label><input id="f-name" autocomplete="name" placeholder="Анна" value="${esc(state.name)}"></div>
          <div class="field"><label for="f-tel">Телефон</label><input id="f-tel" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00" value="${esc(state.tel)}"></div>
          <div class="field"><label for="f-addr">Адрес или район</label><input id="f-addr" placeholder="ул. Чапаева, 12" value="${esc(state.addr)}"></div>
          <div class="field"><label for="f-when">Когда удобно</label><input id="f-when" placeholder="завтра после 18:00" value="${esc(state.when)}"></div>
          <p class="note">${f.approx?"Цены примерные. ":""}Точную стоимость мастер назовёт на бесплатном замере.</p>
        </div>
      </section>
    </div>
  </div>
  <footer class="foot"><span>${esc(f.name)} · ${f.address ? esc(f.address) + ", " : ""}${esc(f.city)} · ${esc(f.phone)}</span><a href="#${route.slug}.owner">Вход для владельца</a></footer>`;
  updateTotal();
  initIntro();
  if (rendered++) document.documentElement.classList.remove("anim");
}

function updateTotal(){
  const t = calcAll();
  document.getElementById("total").textContent = rub(t.total);
  document.getElementById("totalLabel").textContent = t.min ? "Минимальный заказ" : (state.rooms.length > 1 ? `Примерно за ${state.rooms.length} комнаты` : "Примерная стоимость");
}
function refreshRoom(){
  const r = state.rooms[state.cur], c = calcRoom(r, firm().prices);
  document.getElementById("svg").innerHTML = planSVG(r);
  document.getElementById("pf-a").textContent = m(c.area) + " м²";
  document.getElementById("pf-p").textContent = m(c.per) + " м";
  document.getElementById("pf-s").textContent = rub(c.sum);
  updateTotal();
}

/* ===== Заявка ===== */
function requestText(){
  const f = firm(), p = f.prices, t = calcAll();
  const L = ["Заявка на замер — " + f.name, ""];
  state.rooms.forEach((r, i) => {
    const c = t.rooms[i], tex = TEXTURES.find(x => x.id === r.tex).name.toLowerCase();
    L.push(`${r.name}: ${m(r.a)} × ${m(r.b)} м = ${m(c.area)} м², ${tex}`);
    const ex = [];
    if (r.spot) ex.push(`светильники ${r.spot}`); if (r.chand) ex.push(`люстры ${r.chand}`);
    if (r.line) ex.push(`световая линия ${m(r.line)} м`); if (r.corners > 4) ex.push(`углов ${r.corners}`);
    if (r.pipes) ex.push(`трубы ${r.pipes}`); if (r.shadow) ex.push(`теневой профиль ${m(c.per)} м`);
    if (ex.length) L.push("  " + ex.join(", "));
    L.push("  ≈ " + rub(c.sum));
  });
  L.push("", "Итого примерно: " + rub(t.total) + (t.min ? " (минимальный заказ)" : ""), "");
  L.push("Имя: " + (state.name || "—"), "Телефон: " + (state.tel || "—"), "Адрес: " + (state.addr || "—"), "Когда удобно: " + (state.when || "—"));
  return L.join("\n");
}
function chatLink(f, text){
  if (f.tg) return {url: f.tg.startsWith("+") ? `https://t.me/${f.tg}` : `https://t.me/${f.tg}?text=${encodeURIComponent(text)}`, label:"Отправить в Telegram", paste: f.tg.startsWith("+")};
  if (f.vk) return {url: `https://vk.me/${f.vk}`, label:"Отправить во ВКонтакте", paste:true};
  return null;
}
function openSheet(){
  if (!state.tel.trim()) { const el = document.getElementById("f-tel"); el.focus(); el.closest(".field").style.borderColor = "var(--accent)"; el.placeholder = "Нужен телефон, чтобы мастер перезвонил"; return; }
  const f = firm(), text = requestText(), link = chatLink(f, text);
  const sh = document.getElementById("sheet");
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h3 id="sh-t">Заявка готова</h3>
    <p class="note">${link ? "Нажмите «" + link.label + "» — откроется чат с " + esc(f.name) + "." + (link.paste ? " Текст заявки скопируется, вставьте его в чат." : "") : "Скопируйте текст и отправьте его " + esc(f.name) + " или позвоните: " + esc(f.phone) + "."}</p>
    <pre id="req">${esc(text)}</pre>
    <div class="btns">
      ${link ? `<a class="cta" id="send" href="${link.url}" target="_blank" rel="noopener">${link.label}</a>` : ""}
      <button type="button" class="${link ? "ghostbtn" : "cta"}" id="copy">Скопировать текст</button>
      <button type="button" class="ghostbtn" id="close">Назад</button>
    </div>
    <span class="toast" id="toast" aria-live="polite"></span>
  </div>`;
  sh.hidden = false;
  const selectReq = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("req")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.getElementById("toast").textContent = "Текст выделен — скопируйте его"; };
  const copy = () => { try { navigator.clipboard.writeText(text).then(() => { document.getElementById("toast").textContent = "Текст скопирован"; }).catch(selectReq); } catch (e) { selectReq(); } };
  document.getElementById("copy").onclick = copy;
  const send = document.getElementById("send"); if (send && link.paste) send.addEventListener("click", copy);
  document.getElementById("close").onclick = () => { sh.hidden = true; };
  sh.onclick = e => { if (e.target === sh) sh.hidden = true; };
}

/* ===== Панель владельца ===== */
const PRICE_ROWS = [["matte","Матовое полотно","₽/м²"],["satin","Сатиновое полотно","₽/м²"],["gloss","Глянцевое полотно","₽/м²"],["fabric","Тканевое полотно","₽/м²"],["spot","Точечный светильник","₽/шт"],["chand","Люстра","₽/шт"],["corner","Угол сверх 4","₽/шт"],["pipe","Обход трубы","₽/шт"],["shadow","Теневой профиль","₽/м"],["line","Световая линия","₽/м"],["minOrder","Минимальный заказ","₽"]];
let ownerOk = false;
function renderOwner(){
  const f = firm();
  document.getElementById("bar").hidden = true;
  document.title = f.name + " — панель владельца";
  const app = document.getElementById("app");
  if (!ownerOk) {
    app.innerHTML = `<header class="top"><div class="brand"><div class="mark">${esc(f.short)}</div><div><b>${esc(f.name)}</b><small>Панель владельца</small></div></div><a class="phone" href="#${route.slug}">К расчёту</a></header>
    <form class="owner" id="login" style="max-width:420px"><h1 style="font-size:32px">Вход</h1>
      <div class="field"><label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password"></div>
      <p class="note">Для демо пароль: demo1234</p><span class="toast" id="lt" style="color:var(--accent)"></span>
      <button class="cta" type="submit">Войти</button></form>`;
    document.getElementById("login").onsubmit = e => { e.preventDefault(); if (document.getElementById("pw").value === OWNER_PASSWORD) { ownerOk = true; renderOwner(); } else document.getElementById("lt").textContent = "Неверный пароль"; };
    return;
  }
  app.innerHTML = `<header class="top"><div class="brand"><div class="mark">${esc(f.short)}</div><div><b>${esc(f.name)}</b><small>Панель владельца</small></div></div><a class="phone" href="#${route.slug}">К расчёту</a></header>
  <form class="owner" id="ow">
    <div><span class="eyebrow">Ваш прайс</span><h1 style="font-size:36px;margin-top:8px">Цены и заявки</h1><p class="lead" style="margin-top:8px">Меняете цену — калькулятор сразу считает по-новому. Заявки приходят вам в Telegram или ВКонтакте.</p></div>
    <div class="rows">${PRICE_ROWS.map(([k,n,u])=>`<div class="row"><div class="t"><b>${n}</b><small>${u}</small></div><input class="num" id="p-${k}" inputmode="numeric" value="${f.prices[k]}" aria-label="${n}"></div>`).join("")}</div>
    <div class="rows"><div class="row"><div class="t"><b>Telegram для заявок</b><small>ник без @ или номер +7…</small></div><input class="wide" id="p-tg" value="${esc(f.tg)}" aria-label="Telegram"></div>
    <div class="row"><div class="t"><b>Телефон на странице</b></div><input class="wide" id="p-phone" value="${esc(f.phone)}" aria-label="Телефон"></div></div>
    <div class="btns"><button class="cta" type="submit">Сохранить</button><a class="ghostbtn" href="#${route.slug}" style="text-decoration:none">Открыть расчёт</a></div>
    <span class="toast" id="ot" aria-live="polite"></span>
    <p class="note">В демо изменения сохраняются только в этом браузере. В рабочей версии — для всех клиентов.</p>
  </form>`;
  document.getElementById("ow").onsubmit = e => {
    e.preventDefault();
    const prices = {}; PRICE_ROWS.forEach(([k]) => { const v = parseFloat(String(document.getElementById("p-"+k).value).replace(",", ".").replace(/\s/g,"")); if (!isNaN(v) && v >= 0) prices[k] = v; });
    store.set("potolok:"+route.slug, {prices, tg: document.getElementById("p-tg").value.trim().replace(/^@/,""), phone: document.getElementById("p-phone").value.trim()});
    document.getElementById("ot").textContent = "Сохранено";
  };
}

/* ===== События ===== */
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; };
document.addEventListener("click", e => {
  const el = e.target.closest("button,span[data-del]"); if (!el || route.mode) return;
  if (el.dataset.go) { document.getElementById(el.dataset.go).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const r = state.rooms[state.cur], d = el.dataset;
  if (d.del !== undefined) { e.stopPropagation(); state.rooms.splice(+d.del, 1); state.cur = Math.min(state.cur, state.rooms.length - 1); return renderClient(); }
  if (d.room !== undefined) { state.cur = +d.room; return renderClient(); }
  if (el.id === "addRoom") { state.rooms.push(newRoom(state.rooms.length + 1)); state.cur = state.rooms.length - 1; return renderClient(); }
  if (d.tex) { r.tex = d.tex; document.querySelectorAll("[data-tex]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tex === r.tex)); return refreshRoom(); }
  const lim = {spot:[0,40,1], chand:[0,4,1], line:[0,20,.5], corners:[4,16,1], pipes:[0,6,1]};
  const k = d.inc || d.dec;
  if (k) { const [mn, mx, st] = lim[k]; r[k] = Math.min(mx, Math.max(mn, Math.round((r[k] + (d.inc ? st : -st))*10)/10));
    document.getElementById("o-"+k).textContent = m(r[k]);
    el.parentNode.querySelector("[data-dec]").disabled = r[k] <= mn; el.parentNode.querySelector("[data-inc]").disabled = r[k] >= mx;
    return refreshRoom(); }
});
document.addEventListener("input", e => {
  if (route.mode) return;
  const r = state.rooms[state.cur], id = e.target.id;
  if (id === "in-a" || id === "in-b") { const v = num(e.target.value); if (v && v > 0.5 && v <= 30) { r[id === "in-a" ? "a" : "b"] = v; document.getElementById("rng").value = r.a*r.b; refreshRoom(); } }
  if (id === "rng") { const area = +e.target.value, ratio = r.a / r.b; r.b = Math.round(Math.sqrt(area / ratio)*10)/10; r.a = Math.round(area / r.b * 10)/10;
    document.getElementById("in-a").value = m(r.a); document.getElementById("in-b").value = m(r.b); refreshRoom(); }
  if (id === "sh") { r.shadow = e.target.checked; refreshRoom(); }
  if (id === "f-name") state.name = e.target.value; if (id === "f-tel") state.tel = e.target.value;
  if (id === "f-addr") state.addr = e.target.value; if (id === "f-when") state.when = e.target.value;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("sheet").hidden = true; });
document.getElementById("go").onclick = openSheet;

/* Для записи видео: задать состояние снаружи */
window.__demo = (patch) => { Object.assign(state.rooms[state.cur], patch.room || {}); Object.assign(state, patch.form || {}); renderClient(); };

function render(){ route = parse(); document.getElementById("sheet").hidden = true; route.mode === "owner" ? renderOwner() : renderClient(); scrollTo(0,0); }
addEventListener("hashchange", render);
render();
</script>
